name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request supersedes the old run; pushes to main/dev and releases
# always run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # Fast, platform-independent checks that fail before the long builds finish.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: PowerShell scripts are UTF-8 with BOM
        # Windows PowerShell 5.1 reads BOM-less scripts as the ANSI code page (GBK on Chinese
        # Windows), which breaks any non-ASCII string literal.
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            if [ "$(head -c3 -- "$f" | od -An -tx1 | tr -d ' \n')" != "efbbbf" ] && LC_ALL=C grep -q $'[\x80-\xff]' -- "$f"; then
              echo "::error file=$f::含非 ASCII 字符但缺少 UTF-8 BOM，Windows PowerShell 5.1 会按 GBK 解析。"
              bad=1
            fi
          done < <(git ls-files -z -- '*.ps1' '*.psm1' '*.psd1')
          exit $bad
      - name: Add-in scripts parse
        run: for f in addin-wps/js/*.js addin-wps/test/*.js; do node --check "$f"; done
      - name: WPS update tests
        run: node addin-wps/test/updates.js

  build-and-test:
    # Needs .NET Framework 4.8 (csc), Windows PowerShell 5.1 and Git for Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustc --version

      - name: Build the add-in and kernel, run update-check tests
        shell: powershell
        run: .\scripts\build.ps1 -Test

      - name: Run UI layout tests
        shell: powershell
        run: .\scripts\build.ps1 -UiTest

      - name: Run history pane first-paint tests
        shell: powershell
        run: .\scripts\build.ps1 -NoRust -PaneTest

      # scripts/package.ps1 -Test also runs installer probes that need desktop Word, so CI only
      # verifies that the release package builds and that document versions match.
      - name: Build release package
        shell: powershell
        run: .\scripts\package.ps1 -NoBuild

      - name: Verify the Windows release payload
        shell: powershell
        run: |
          $setup = Get-ChildItem -LiteralPath .\dist -Filter '*-Setup.exe' | Select-Object -First 1
          $probe = Start-Process -FilePath $setup.FullName -ArgumentList '/verify' -WindowStyle Hidden -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw 'Setup payload verification failed.' }
          $zip = Get-ChildItem -LiteralPath .\dist -Filter '*-windows.zip' | Select-Object -First 1
          $staging = Join-Path $env:RUNNER_TEMP 'wordgit-release-check'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $staging
          $payload = Get-ChildItem -LiteralPath $staging -Directory | Select-Object -First 1
          if (!(Test-Path -LiteralPath (Join-Path $payload.FullName 'docs\WPS.md'))) { throw 'Missing WPS installation guide.' }
          & (Join-Path $payload.FullName 'bin\wordgit.exe') version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged kernel could not start.' }

      - uses: actions/upload-artifact@v7
        with:
          name: wordgit-package
          path: dist/
          if-no-files-found: error

  rust:
    # Rust core and service: unit tests, real-git integration tests and the HTTP service tests.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml selects the version and components; rustup installs it on first use.
        run: rustc --version && cargo clippy --version
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Linux package install, upgrade and uninstall
        if: runner.os == 'Linux'
        run: |
          cargo build --locked -p wordgit
          package_dir="$RUNNER_TEMP/wordgit-package"
          bash scripts/package-linux.sh target/debug/wordgit "$package_dir"
          bash scripts/test-linux-package.sh "$package_dir"/WordGit-*-linux-x86_64.tar.gz
      - name: macOS package install, upgrade and uninstall
        if: runner.os == 'macOS'
        run: |
          cargo build --locked -p wordgit
          package_dir="$RUNNER_TEMP/wordgit-package"
          bash scripts/package-macos.sh target/debug/wordgit "$package_dir"
          bash scripts/test-macos-package.sh "$package_dir"/WordGit-*-macos-*.tar.gz
