name: CodeQL

on:
  push:
    branches: [main, rust-core]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Trace the existing .NET Framework compiler invocation.
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the Windows add-in and installer
        if: matrix.language == 'csharp'
        shell: powershell
        run: .\package.ps1

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
