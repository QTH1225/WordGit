name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

# A newer push to the same pull request supersedes the old analysis; branch and weekly scans
# always run to completion.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Trace the existing .NET Framework compiler invocation.
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the Windows add-in and installer
        if: matrix.language == 'csharp'
        shell: powershell
        run: |
          rustup install
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
          .\scripts\package.ps1

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
