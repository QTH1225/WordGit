name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: wordgit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Validate tag and extract changelog
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/prepare-release.py "$RELEASE_TAG" release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml

  linux-package:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build Linux x86_64 distribution
        # Same container as local development and CI; see scripts/dev.sh.
        run: bash scripts/dev.sh package
      - uses: actions/upload-artifact@v7
        with:
          name: wordgit-linux
          path: dist/
          if-no-files-found: error

  macos-package:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build macOS universal distribution
        run: |
          rustup install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin -p wordgit
          cargo build --locked --release --target x86_64-apple-darwin -p wordgit
          lipo -create target/aarch64-apple-darwin/release/wordgit target/x86_64-apple-darwin/release/wordgit -output target/wordgit-universal
          bash scripts/package-macos.sh target/wordgit-universal dist universal
      - uses: actions/upload-artifact@v7
        with:
          name: wordgit-macos
          path: dist/
          if-no-files-found: error

  publish:
    needs: [validate, test, linux-package, macos-package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: wordgit-package
          path: windows
      - uses: actions/download-artifact@v8
        with:
          name: wordgit-linux
          path: linux
      - uses: actions/download-artifact@v8
        with:
          name: wordgit-macos
          path: macos
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Assemble and verify release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir release
          setup="WordGit-$VERSION-Setup.exe"
          windows="WordGit-$VERSION-windows.zip"
          linux="WordGit-$VERSION-linux-x86_64.tar.gz"
          macos="WordGit-$VERSION-macos-universal.tar.gz"
          source="WordGit-$VERSION-source.zip"
          (cd windows && sha256sum -c SHA256SUMS.txt)
          (cd linux && sha256sum -c "$linux.sha256")
          (cd macos && sha256sum -c "$macos.sha256")
          cp "windows/$setup" "windows/$windows" "linux/$linux" "linux/$linux.sha256" "macos/$macos" "macos/$macos.sha256" release/
          git archive --format=zip --prefix="WordGit-$VERSION-source/" -o "release/$source" HEAD
          (cd release && sha256sum "$setup" "$windows" "$linux" "$macos" "$source" > SHA256SUMS.txt)
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: bash scripts/publish-release.sh
