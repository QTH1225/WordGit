name: 功能建议
description: 希望 WordGit 增加或改进的功能
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在写作、审阅或协作时遇到了什么不便
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的做法
      description: 理想情况下应该怎样操作，结果是什么
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法
  - type: dropdown
    id: area
    attributes:
      label: 相关功能
      options:
        - 提交与历史
        - 分支与合并
        - 比较与审阅
        - 远程协作
        - 安装与更新
        - 界面
        - 其他
    validations:
      required: true
