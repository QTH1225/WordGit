<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <script src="../js/version.js"></script>
    <script src="../js/core.js"></script>
</head>
<body class="dialog">
    <div class="grow">
        <h3>WordGit <span id="version"></span></h3>
        <p>Word / WPS 文档版本管理：提交、分支、返稿合并与远程协作。</p>
        <p id="service" class="message"></p>
        <p>作者：QTH1225 · GPL-3.0-only</p>
        <p class="muted">项目主页：https://github.com/QTH1225/WordGit</p>
    </div>
    <div class="buttons"><button id="ok" class="primary">关闭</button></div>
    <script>
        var data = WordGit.dialogData();
        document.getElementById("version").textContent = window.WORDGIT_VERSION || "";
        var service = document.getElementById("service");
        if (data.info) {
            service.textContent = "本地服务：已连接（" + data.info.version + "，" + data.info.os + "）\n数据目录：" + (data.info.dataDirectory || data.info.home);
        } else {
            service.className = "error";
            service.textContent = "本地服务：未连接。" + (data.error || "");
        }
        document.getElementById("ok").onclick = function () { WordGit.finishDialog(true); };
    </script>
</body>
</html>
